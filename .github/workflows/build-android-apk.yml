name: Build Android APK

# Potion Sort — Vite + React web game wrapped as a native Android app with Capacitor.
# Template: mirrors Grid-Blast-Zen-Puzzle/build-android-apk.yml (the org's Capacitor样板).
#
# Local equivalent:  npm run android:sync && ./android/gradlew -p android assembleDebug

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish APK directly to GitHub Releases'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Optional Release tag (e.g. v1.0.0). Leave empty to auto-generate.'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark GitHub Release as Pre-release (recommended for debug/test APKs)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: TypeScript check
        run: npm run lint

      - name: Build web bundle & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Accept Android SDK licenses & ensure SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Build Android Debug APK
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug --no-daemon

      - name: Prepare named APK file
        id: apk
        env:
          INPUT_TAG: ${{ inputs.release_tag || '' }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="v${PKG_VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi

          mkdir -p dist-apk
          APK_NAME="PotionSort-${TAG}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/${APK_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist-apk/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PotionSort-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true || inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.apk.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          NOTES=$(printf '%s\n' \
            "## Potion Sort Android 测试安装包" \
            "- **版本标签**: \`${TAG}\`" \
            "- **APK 文件**: \`${APK_NAME}\`" \
            "- **代码提交**: \`${GITHUB_SHA}\`" \
            "" \
            "直接下载下方 \`${APK_NAME}\` 到安卓手机安装即可。")

          PRERELEASE_FLAG="--prerelease"
          if [ "${IS_PRERELEASE}" = "false" ]; then
            PRERELEASE_FLAG=""
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK_PATH}" --clobber
          else
            gh release create "${TAG}" "${APK_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "Potion Sort ${TAG}" \
              --notes "${NOTES}" \
              ${PRERELEASE_FLAG}
          fi